# Projects shown in the homepage slider. `accent` and `accent_2` are taken from each app's own palette.
- name: Parche
  url: https://fsoftt.github.io/Parche/
  image: /assets/projects/parche.jpg
  badge: Media center
  accent: "#8b5cf6"
  accent_2: "#ec4899"
  description: >-
    Parche is a media center for Android, Android TV and Windows built with .NET MAUI. It shows a TMDB or Cinemeta
    catalog and plays content from the addons you add, compatible with the Stremio addon protocol.
  tags: [.NET MAUI, Android TV, Windows]
  highlights:
    - Phone, TV (D-pad) and desktop layouts
    - ExoPlayer on Android, LibVLC on Windows

- name: ParcheRoku
  url: https://fsoftt.github.io/Parche/#roku
  image: /assets/projects/parche-roku.png
  badge: Roku channel
  accent: "#ec4899"
  accent_2: "#8b5cf6"
  description: >-
    The Roku version of Parche, written in BrightScript and SceneGraph. A full-HD channel, fully navigable with the
    remote, with continue watching, My list and external subtitles from your addons.
  tags: [BrightScript, SceneGraph, Roku]
  highlights:
    - Sources ranked by language, quality and size
    - Spanish, English and Portuguese UI

- name: Wired
  url: https://fsoftt.github.io/Wired/
  image: /assets/projects/wired.jpg
  badge: Music player
  accent: "#22d3ee"
  accent_2: "#8b5cf6"
  description: >-
    Wired is a cross-platform music player built with .NET MAUI around source plugins. Search, stream or download to
    an offline library that survives uninstalling the app, with synced lyrics and Spotify playlist import.
  tags: [.NET MAUI, MVVM, Plugins]
  highlights:
    - Offline library with background downloads
    - Synced lyrics from LRCLIB

- name: PiccoloReader
  url: https://fsoftt.github.io/PiccoloReader/
