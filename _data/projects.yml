- name: Tranqui
  url: https://fsoftt.github.io/Tranqui/
  image: /assets/projects/tranqui.jpg
  badge: Spam blocker
  accent: "#3d7fc4"
  accent_2: "#e9dcc4"
  description: >-
    Tranqui is a privacy-focused mobile spam blocker. It identifies unwanted calls and builds a shared database of
    spam numbers from community reports, without storing plain phone numbers in clear text.
  tags: [Mobile, Privacy, Community data]
  highlights:
    - Hash-based phone storage
    - Shared spam detection network

- name: Percha
  url: https://fsoftt.github.io/Percha/
  image: /assets/projects/percha.jpg
  badge: Pattern design
  accent: "#ff4d2e"
  accent_2: "#d4ff3a"
  description: >-
    Percha generates ready-to-cut clothing patterns from user measurements, helping turn body dimensions into
